name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  # Allows triggering the deploy by hand from the Actions tab
  workflow_dispatch:

env:
  # Must match the Docker Compose project name on the VPS exactly.
  # Check it with: docker compose ls
  PROJECT_NAME: diego-portfolio-v1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Hostinger project update
        env:
          VM_ID: ${{ secrets.HOSTINGER_VM_ID }}
          API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${VM_ID:-}" ] || [ -z "${API_TOKEN:-}" ]; then
            echo "::error::Missing HOSTINGER_VM_ID or HOSTINGER_API_TOKEN repository secret"
            exit 1
          fi

          # Host is developers.hostinger.com/api -- api.hostinger.com does not
          # resolve (Cloudflare 530/1016). Path has no "/projects/" segment.
          url="https://developers.hostinger.com/api/vps/v1/virtual-machines/${VM_ID}/docker/${PROJECT_NAME}/update"
          echo "POST $url"

          # -w appends the status code on its own line so we can inspect it,
          # instead of the previous silent-success behaviour.
          response=$(curl -sS -X POST "$url" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: application/json" \
            -w $'\n%{http_code}')

          status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')

          echo "HTTP $status"
          echo "$body"

          if [ "$status" -ge 400 ]; then
            case "$status" in
              401|403) hint="HOSTINGER_API_TOKEN is invalid, expired, or lacks VPS scope" ;;
              404)     hint="project '${PROJECT_NAME}' not found on VM ${VM_ID} (check: docker compose ls)" ;;
              5*)      hint="Hostinger API side error -- retry, or check status.hostinger.com" ;;
              *)       hint="see the response body above" ;;
            esac
            echo "::error::Hostinger API returned HTTP $status -- $hint"
            exit 1
          fi

          echo "Deploy triggered successfully."
