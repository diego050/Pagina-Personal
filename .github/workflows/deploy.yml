name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  # Allows triggering the deploy by hand from the Actions tab
  workflow_dispatch:

env:
  PROJECT_DIR: /docker/diego-portfolio-v1
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Deploys over plain SSH on purpose: the Hostinger docker_compose_update
      # endpoint only rebuilds the containers from whatever is already on disk,
      # it never pulls new code from GitHub.
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          [ -n "${SSH_KEY:-}"  ] || { echo "::error::Missing repository secret VPS_SSH_KEY"; exit 1; }
          [ -n "${VPS_HOST:-}" ] || { echo "::error::Missing repository secret VPS_HOST"; exit 1; }
          [ -n "${VPS_USER:-}" ] || { echo "::error::Missing repository secret VPS_USER"; exit 1; }

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # accept-new trusts the host on first connect but still refuses a CHANGED
          # host key, which is what would signal a man-in-the-middle.
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              "$VPS_USER@$VPS_HOST" \
              "set -euo pipefail; \
               cd '${PROJECT_DIR}'; \
               echo '--- pulling ---'; \
               git pull --ff-only origin main; \
               echo '--- rebuilding ---'; \
               docker compose -f '${COMPOSE_FILE}' up -d --build; \
               echo '--- status ---'; \
               docker compose -f '${COMPOSE_FILE}' ps"

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Smoke check
        run: |
          set -euo pipefail
          # Give the containers a moment to finish coming up
          sleep 15
          code=$(curl -sS -o /dev/null -m 30 -w '%{http_code}' https://dbtech.cloud/)
          echo "https://dbtech.cloud/ -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Site returned HTTP $code after deploy"
            exit 1
          fi
