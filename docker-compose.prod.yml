services:
  backend:
    build: ./backend
    restart: always
    # ALL secrets live here: SECRET_KEY, ADMIN_USERNAME, ADMIN_PASSWORD,
    # RESEND_API_KEY, RESEND_FROM, CONTACT_RECIPIENT.
    # This file is gitignored and must be created on the server before deploying.
    # Nothing secret may go in the `environment:` block below -- it is committed.
    env_file:
      - ./backend/.env
    # Non-secret, production-specific values only.
    environment:
      - DATABASE_URL=sqlite:////app/data/database.db
      - FRONTEND_URL=https://dbtech.cloud
    volumes:
      - ./backend/data:/app/data
    networks:
      - portfolio-network

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_BACKEND_URL=https://dbtech.cloud/api
        - VITE_SITE_URL=https://dbtech.cloud
    networks:
      - portfolio-network

  nginx:
    build: ./nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.prod:/etc/nginx/conf.d/default.conf:ro
      - ./backend/static/uploads:/app/static/uploads:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt:ro
      - webroot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - portfolio-network

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge

volumes:
  certbot-etc:
  certbot-var:
  webroot:
